<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whatapp</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#075E54" />
  <meta name="description" content="Whatapp � a real-time public board for sharing text and files." />


  <style>
    /* -- DESIGN TOKENS --------------------------------------- */
    :root {
      --teal:          #075E54;
      --teal-dark:     #054d44;
      --teal-light:    #128C7E;
      --green:         #25D366;
      --btn-green:     #00a884;
      --bg-panel:      #f0f2f5;
      --bg-chat:       #EFEAE2;
      --bubble-in:     #FFFFFF;
      --bubble-out:    #DCF8C6;
      --text-main:     #111B21;
      --text-sub:      #667781;
      --border:        #d1d7db;
      --font:          "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --tray-h:        78px;      /* height of the fixed bottom tray */
    }

    /* -- RESET ----------------------------------------------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: var(--font);
      background-color: var(--bg-chat);
      background-image: var(--doodle);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    /* -- CHAT COLUMN ----------------------------------------- */
    /* Transparent shell � the doodle background runs across the
       whole page so the column never shows visible edges. */
    .board {
      position: relative;
      width: 100%;
      max-width: 860px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* -- HEADER ---------------------------------------------- */
    .board-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.65rem 1rem;
      background: var(--teal);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    .header-avatar {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      user-select: none;
    }

    .header-meta { flex: 1; min-width: 0; }

    .board-header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .board-header p {
      font-size: 0.78rem;
      opacity: 0.85;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .online-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 0.3rem;
      vertical-align: 1px;
    }

    .header-user {
      flex-shrink: 0;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 0.75rem;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* -- LOGOUT BUTTON --------------------------------------- */
    .logout-btn {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .logout-btn:hover { background: rgba(255,255,255,0.15); }

    /* -- FEED ------------------------------------------------ */
    /* <section class="post"> nodes are injected here by app.js */
    #feed {
      flex: 1;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 1.2rem 1rem calc(var(--tray-h) + 1.2rem);
      display: flex;
      flex-direction: column;
    }

    .date-chip {
      align-self: center;
      background: rgba(255,255,255,0.85);
      color: var(--text-sub);
      font-size: 0.72rem;
      font-weight: 500;
      padding: 0.2rem 0.8rem;
      border-radius: 999px;
      box-shadow: 0 1px 1px rgba(11,20,26,0.13);
      margin: 0.6rem 0;
      user-select: none;
    }

    /* Empty-state */
    #feed-empty {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-sub);
      font-size: 0.95rem;
      user-select: none;
    }

    #feed-empty span {
      display: block;
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      opacity: 0.55;
    }

    /* -- POST BUBBLE ----------------------------------------- */
    .post {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: 78%;
      min-width: 0;
      margin-top: 0.4rem;
      animation: pop-in 0.18s ease-out both;
    }

    .post:first-child { margin-top: 0; }
    .post.grouped { margin-top: 2px; }
    .post.grouped .post-author { display: none; }

    .post.own {
      align-items: flex-end;
      align-self: flex-end;
    }

    @keyframes pop-in {
      from { opacity: 0; transform: translateY(5px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .post { animation: none; }
    }

    .post-author {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--teal-light);
      line-height: 1.2;
      margin: 0 0 0.1rem 0.3rem;
    }
    .post.own .post-author { margin-right: 0.3rem; }

    .bubble {
      position: relative;
      max-width: 100%;
      background: var(--bubble-in);
      border-radius: 8px 8px 8px 3px;
      box-shadow: 0 1px 1px rgba(11,20,26,0.13);
      padding: 0.45rem 0.65rem 0.3rem;
    }

    .post.own .bubble {
      background: var(--bubble-out);
      border-radius: 8px 8px 3px 8px;
    }

    .post-text {
      font-size: 0.95rem;
      line-height: 1.4;
      color: var(--text-main);
      word-break: break-word;
      white-space: pre-wrap;
    }

    .post-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.3rem;
      font-size: 0.68rem;
      color: var(--text-sub);
      margin-top: 0.15rem;
      user-select: none;
    }

    .post-ticks {
      font-size: 0.72rem;
      letter-spacing: -1px;
    }
    .post.own .post-ticks { color: #53bdeb; }

    /* Erase button � lives inside the meta row */
    .post-delete {
      border: none;
      background: none;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 0.72rem;
      line-height: 1;
      padding: 0 0.1rem;
      opacity: 0.55;
      transition: color 0.15s, opacity 0.15s;
    }
    .post-delete:hover { color: #d33; opacity: 1; }

    /* Erase animation � added by JS before DOM removal */
    .post.erasing {
      animation: erase-out 0.22s ease-in forwards;
      pointer-events: none;
    }

    @keyframes erase-out {
      to { opacity: 0; transform: scale(0.95); max-height: 0; margin: 0; padding: 0; }
    }

    /* -- FILE ATTACHMENTS ------------------------------------ */
    .post-image {
      display: block;
      max-width: 100%;
      max-height: 340px;
      border-radius: 6px;
      margin-bottom: 0.35rem;
    }

    .post-video {
      display: block;
      max-width: 100%;
      max-height: 340px;
      border-radius: 6px;
      margin-bottom: 0.35rem;
      background: #000;
    }

    .post-audio {
      width: 100%;
      max-width: 280px;
      height: 38px;
      margin-bottom: 0.35rem;
    }

    .post-file {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 0.35rem;
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      background: rgba(11,20,26,0.06);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.6rem;
      font-size: 0.82rem;
      color: var(--teal-light);
      text-decoration: none;
    }
    .post-file:hover { background: rgba(11,20,26,0.1); }
    .post-file-icon { flex-shrink: 0; font-size: 1rem; }

    /* -- CHAT TRAY (fixed bottom compose bar) ---------------- */
    .tray {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: flex;
      justify-content: center;
      padding: 0.6rem 1rem calc(0.6rem + env(safe-area-inset-bottom));
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .tray-inner {
      width: 100%;
      max-width: 760px;
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
    }

    .tray textarea {
      flex: 1;
      min-height: 42px;
      max-height: 120px;
      resize: none;
      font-family: var(--font);
      font-size: 0.95rem;
      color: var(--text-main);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 0.55rem 1rem;
      outline: none;
      line-height: 1.4;
      overflow-y: auto;
      transition: border-color 0.15s;
    }

    .tray textarea::placeholder { color: var(--text-sub); }
    .tray textarea:focus { border-color: var(--teal-light); }

    /* Attach button */
    .file-btn {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: none;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
    }
    .file-btn:hover {
      color: var(--teal-light);
      background: rgba(11,20,26,0.06);
    }
    .file-btn.has-file { color: var(--btn-green); }
    .file-btn svg { width: 24px; height: 24px; }

    /* Send button */
    .tray button {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--btn-green);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }
    .tray button:hover  { background: var(--teal-light); }
    .tray button:active { transform: scale(0.94); }
    .tray button:disabled { background: #b3babf; cursor: default; }
    .tray button:disabled:hover { background: #b3babf; }

    .tray button.sending svg { animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .tray button .rec-icon { display: none; }

    /* Mic button � always visible beside Send */
    .tray button#mic-btn {
      background: none;
      color: var(--text-sub);
      border: none;
      width: 42px;
      height: 42px;
    }
    .tray button#mic-btn:hover {
      color: var(--teal-light);
      background: rgba(11,20,26,0.06);
    }
    .tray button#mic-btn.recording {
      background: #ff3b30;
      color: #fff;
      width: 44px;
      height: 44px;
    }
    .tray button#mic-btn.recording .mic-icon { display: none; }
    .tray button#mic-btn.recording .rec-icon { display: block; }

    /* -- VOICE-NOTE RECORDING STATUS ------------------------- */
    #rec-status {
      position: fixed;
      left: 50%;
      bottom: calc(var(--tray-h) + 3rem);
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 0.5rem;
      background: rgba(17, 27, 33, 0.92);
      color: #fff;
      font-family: var(--font);
      font-size: 0.8rem;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
      z-index: 95;
      white-space: nowrap;
    }
    #rec-status.show { display: flex; }
    .rec-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff3b30;
      animation: rec-pulse 1s ease-in-out infinite;
    }
    @keyframes rec-pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }
    .rec-time {
      font-variant-numeric: tabular-nums;
      min-width: 3ch;
      text-align: right;
    }
    .rec-label { opacity: 0.85; }

    /* -- ATTACHMENT PREVIEW ---------------------------------- */
    #attach-preview {
      position: fixed;
      left: 50%;
      bottom: calc(var(--tray-h) + 0.5rem);
      transform: translateX(-50%);
      width: 100%;
      max-width: 760px;
      display: none;
      flex-direction: row;
      gap: 0.5rem;
      overflow-x: auto;
      padding: 0.4rem 0.8rem;
      z-index: 90;
    }
    #attach-preview.has-files { display: flex; }

    .attach-chip {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      padding: 0.35rem 0.5rem;
      max-width: 220px;
    }
    .attach-thumb {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: var(--bg-panel);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .attach-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .attach-info { min-width: 0; }
    .attach-name {
      font-size: 0.78rem;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }
    .attach-size { font-size: 0.68rem; color: var(--text-sub); }
    .attach-remove {
      flex-shrink: 0;
      border: none;
      background: none;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.2rem;
      border-radius: 50%;
      transition: color 0.15s, background 0.15s;
    }
    .attach-remove:hover { color: #d33; background: rgba(217,51,51,0.1); }

    /* -- DRAG & DROP OVERLAY --------------------------------- */
    #drop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 94, 84, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 400;
      pointer-events: none;
    }
    #drop-overlay.show { display: flex; }
    .drop-box {
      border: 3px dashed #fff;
      border-radius: 12px;
      color: #fff;
      background: rgba(7, 94, 84, 0.55);
      font-size: 1.3rem;
      font-weight: 600;
      padding: 2rem 3rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    /* -- TOAST NOTIFICATION ---------------------------------- */
    #toast {
      position: fixed;
      bottom: calc(var(--tray-h) + 0.75rem);
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: #111b21;
      color: #fff;
      font-family: var(--font);
      font-size: 0.82rem;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
      max-width: 90%;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 200;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* -- AUTH OVERLAY ---------------------------------------- */
    #auth-overlay {
      position: fixed; inset: 0;
      background-color: var(--bg-chat);
      background-image: var(--doodle);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 300;
    }
    #auth-overlay.hidden { display: none; }

    .auth-card {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border-radius: 10px;
      padding: 2rem 1.75rem;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    }

    .auth-logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 0.9rem;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      font-size: 1.6rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .auth-card h2 {
      color: var(--teal-dark);
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .auth-card p {
      color: var(--text-sub);
      font-size: 0.85rem;
      margin-bottom: 1.4rem;
    }

    .auth-card input {
      display: block;
      width: 100%;
      margin-bottom: 0.8rem;
      padding: 0.6rem 0.25rem;
      font-family: var(--font);
      font-size: 0.95rem;
      color: var(--text-main);
      background: transparent;
      border: none;
      border-bottom: 1.5px solid var(--border);
      border-radius: 0;
      outline: none;
      transition: border-color 0.15s;
    }
    .auth-card input:focus { border-color: var(--green); }
    .auth-card input::placeholder { color: var(--text-sub); }

    .auth-card button {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.6rem;
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background: var(--teal-light);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .auth-card button:hover { background: var(--teal); }
    .auth-card button:disabled { opacity: 0.55; cursor: default; }

    .auth-card .auth-error {
      color: #d33;
      font-family: var(--font);
      font-size: 0.82rem;
      margin-top: 0.7rem;
      min-height: 1.2em;
    }
    .auth-card .auth-toggle { color: var(--teal-light); font-family: var(--font); font-size: 0.85rem; margin-top: 1rem; cursor: pointer; }
    .auth-card .auth-toggle:hover { text-decoration: underline; }
    .auth-card .auth-forgot {
      color: var(--text-sub);
      font-family: var(--font);
      font-size: 0.8rem;
      margin-top: 0.4rem;
      cursor: pointer;
    }
    .auth-card .auth-forgot:hover { color: var(--teal-light); text-decoration: underline; }
    .auth-card .auth-note {
      color: var(--text-sub);
      font-size: 0.8rem;
      margin-bottom: 1.2rem;
      line-height: 1.4;
    }
    .auth-card .auth-or {
      color: var(--text-sub);
      font-size: 0.75rem;
      margin: 1.1rem 0 0.9rem;
      letter-spacing: 1px;
    }
    .hidden { display: none !important; }

    /* -- RESPONSIVE ------------------------------------------ */
    @media (max-width: 520px) {
      .post { max-width: 92%; }
      .board-header p { display: none; }
      #feed { padding-left: 0.6rem; padding-right: 0.6rem; }
    }
  </style>
</head>
<body>

<div class="board">

  <!-- HEADER -->
  <header class="board-header">
    <div class="header-avatar" aria-hidden="true">W</div>
    <div class="header-meta">
      <h1>Whatapp</h1>
      <p><span class="online-dot"></span>online � public board</p>
    </div>
    <span class="header-user" id="header-user"></span>
    <button class="logout-btn" id="logout-btn" title="Sign out" aria-label="Log out">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </header>

  <!--
    FEED � app.js injects a new <section class="post"> here
    for every post it receives from GET /api/posts, and for
    each new post created via the compose form.
  -->
  <main id="feed">
    <div id="feed-empty">
      <span>?</span>
      The board is clean. Write the first thing.
    </div>
  </main>

</div><!-- /.board -->

<!-- CHAT TRAY � fixed compose area at the bottom -->
<div class="tray">
  <div class="tray-inner">
    <textarea
      id="post-input"
      placeholder="Type a message"
      maxlength="500"
      rows="1"
      aria-label="Message"
    ></textarea>
    <label class="file-btn" id="file-label" title="Attach files" aria-label="Attach files">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
      </svg>
      <input type="file" id="file-input" hidden multiple />
    </label>
    <button id="mic-btn" title="Record a voice note" aria-label="Record a voice note">
      <svg class="mic-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10v1a7 7 0 0 0 14 0v-1"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
      </svg>
      <svg class="rec-icon" viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true">
        <rect x="6" y="6" width="12" height="12" rx="2"/>
      </svg>
    </button>
    <button id="post-btn" title="Send" aria-label="Send">
      <svg class="send-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
        <path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<!-- Voice-note recording status -->
<div id="rec-status" aria-live="polite">
  <span class="rec-dot"></span>
  <span class="rec-time" id="rec-time">0:00</span>
  <span class="rec-label">Recording� tap to stop</span>
</div>

<!-- Attachment preview � files ready to send with the next post -->
<div id="attach-preview"></div>

<!-- Drop overlay � shown while dragging files over the app -->
<div id="drop-overlay" aria-hidden="true">
  <div class="drop-box">Drop files to attach</div>
</div>

<!-- Auth overlay � shown when the user isn't logged in -->
<div id="auth-overlay">
  <div class="auth-card">
    <div class="auth-logo" aria-hidden="true">W</div>
    <h2>Whatapp</h2>
    <p id="auth-subtitle">Sign in or create an account</p>
    <input type="text"     id="auth-display" class="hidden" placeholder="Display name (optional)" autocomplete="nickname" maxlength="40" />
    <input type="email"    id="auth-email" placeholder="Email" autocomplete="email" />
    <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password" />
    <button id="auth-btn">Sign in</button>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-toggle" id="auth-toggle">No account? Create one</div>
    <div class="auth-forgot" id="auth-forgot">Forgot password?</div>

    <div id="reset-panel" class="hidden">
      <p class="auth-note" id="reset-note">Enter your email and we'll send a reset link.</p>
      <div id="reset-request-group">
        <input type="email" id="reset-email" placeholder="Email" autocomplete="email" />
        <button id="reset-request-btn">Send reset link</button>
      </div>
      <div id="recovery-panel" class="hidden">
        <input type="password" id="recovery-new-pass" placeholder="New password" autocomplete="new-password" />
        <input type="password" id="recovery-confirm-pass" placeholder="Confirm new password" autocomplete="new-password" />
        <button id="recovery-confirm-btn">Set new password</button>
      </div>
      <div class="auth-error" id="reset-error"></div>
      <div class="auth-toggle" id="reset-back">Back to sign in</div>
    </div>
  </div>
</div>

<!-- Toast notification for errors -->
<div id="toast"></div>

<!-- Runtime config (Supabase URL + anon key) and Supabase client -->
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Frontend logic -->
<script src="app.js"></script>
</body>
</html>
