services:
  - type: web
    name: whatapp
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      # Supabase project settings (Project Settings → API)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Supabase Postgres connection string (Project Settings → Database → Connection pooling)
      - key: DATABASE_URL
        sync: false
      # Optional upload limits
      - key: MAX_FILE_SIZE_MB
        value: 15
      - key: MAX_FILES
        value: 5
